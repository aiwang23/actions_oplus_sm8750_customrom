# 基线工作流 v2：补齐 manifest 锁定的模块源码和设备树；不改变内核配置。
name: Erhai LineageOS exact-source baseline
run-name: Erhai baseline - original config - no container patches
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: erhai-exact-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash --noprofile --norc -Eeuo pipefail {0}
    env:
      KERNEL_COMMIT: 6350e8af3f4c452d087fbd6fe1aabe03cbc0af75
      CLANG_COMMIT: 29182889399818f97baa65ea238c80e8117981eb
      BUILD_TOOLS_COMMIT: 811c6e2938d53b3c318d7635b03931601a68c765
      CONFIG_SHA256: b45a6fc5b9cbddd703d0e606e6250395cdaac1f8b91aa1f9627d42848f41962c
      EXPECTED_RELEASE: 6.6.144-4k-g6350e8af3f4c
      KERNEL_SOURCE: sources/kernel/oneplus/sm8750
      MODULES_COMMIT: e05c031ce1512477f2d5db7bfa26a859adfcfbc7
      DEVICETREES_COMMIT: 2f46fad8ad309266de2405666016f8e0679883d5
    steps:
    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bc bison flex build-essential libssl-dev libelf-dev libxml2 libncurses-dev zlib1g-dev python3 rsync curl git xz-utils lz4
        mkdir -p diagnostics artifacts
        sudo fallocate -l 8G /mnt/erhai-baseline.swap
        sudo chmod 600 /mnt/erhai-baseline.swap
        sudo mkswap /mnt/erhai-baseline.swap
        sudo swapon /mnt/erhai-baseline.swap
        free -h | tee diagnostics/memory.txt
    - name: Restore captured config; verify input hash
      env:
        CAPTURED_CONFIG_GZIP_B64: 
      run: |
        python3 - <<'CHECK'
        import base64, gzip, hashlib, os, pathlib
        config = gzip.decompress(base64.b64decode(os.environ['CAPTURED_CONFIG_GZIP_B64']))
        assert hashlib.sha256(config).hexdigest() == os.environ['CONFIG_SHA256'], 'Captured config hash mismatch'
        pathlib.Path('diagnostics/captured.config').write_bytes(config)
        print('Captured config SHA256:', hashlib.sha256(config).hexdigest())
        CHECK
    - name: Fetch exact kernel, modules and devicetrees; verify links
      run: |
        fetch_exact() {
          local directory="$1" repository="$2" revision="$3"
          mkdir -p "$directory"
          git init "$directory"
          git -C "$directory" remote add origin "https://github.com/LineageOS/${repository}.git"
          git -C "$directory" -c http.version=HTTP/1.1 fetch --no-tags --depth=1 origin "$revision"
          git -C "$directory" checkout --detach FETCH_HEAD
          test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          test -z "$(git -C "$directory" status --porcelain)"
          git -C "$directory" show -s --format=fuller HEAD > "diagnostics/${repository}-commit.txt"
        }
        # Preserve the original sibling layout: the kernel contains relative symlinks into both trees.
        fetch_exact "$KERNEL_SOURCE" android_kernel_oneplus_sm8750 "$KERNEL_COMMIT"
        fetch_exact "${KERNEL_SOURCE}-modules" android_kernel_oneplus_sm8750-modules "$MODULES_COMMIT"
        fetch_exact "${KERNEL_SOURCE}-devicetrees" android_kernel_oneplus_sm8750-devicetrees "$DEVICETREES_COMMIT"
        python3 - <<'CHECK'
        import os, pathlib, subprocess, sys
        root = pathlib.Path(os.environ['KERNEL_SOURCE'])
        entries = subprocess.check_output(['git', '-C', str(root), 'ls-files', '-s', '-z']).split(b'\0')
        broken = []
        checked = []
        for entry in entries:
            if not entry:
                continue
            metadata, name = entry.split(b'\t', 1)
            if metadata.split()[0] != b'120000':
                continue
            relative = os.fsdecode(name)
            path = root / relative
            target = os.readlink(path)
            if 'sm8750-modules' in target or 'sm8750-devicetrees' in target:
                checked.append(f'{relative} -> {target}')
                if not path.exists():
                    broken.append(f'{relative} -> {target}')
        required = [
            'drivers/base/kernelFwUpdate/Kconfig',
            'drivers/base/touchpanel_notify/Kconfig',
            'drivers/base/magtransfer/Kconfig',
            'arch/arm64/boot/dts/vendor',
        ]
        for relative in required:
            if not (root / relative).exists():
                broken.append('Required path missing: ' + relative)
        pathlib.Path('diagnostics/external-source-links.txt').write_text('\n'.join(checked) + '\n')
        if broken:
            print('Broken source dependencies:\n' + '\n'.join(broken))
            sys.exit(1)
        print(f'Checked {len(checked)} external source links: all resolve.')
        CHECK
    - name: Download pinned Clang and kernel build tools
      run: |
        mkdir -p toolchain/clang toolchain/build-tools
        curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1800   "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/clang-r596125.tar.gz" -o toolchain/clang.tar.gz
        tar -xzf toolchain/clang.tar.gz -C toolchain/clang
        rm toolchain/clang.tar.gz
        curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900   "https://android.googlesource.com/kernel/prebuilts/build-tools/+archive/${BUILD_TOOLS_COMMIT}/linux-x86.tar.gz" -o toolchain/build-tools.tar.gz
        tar -xzf toolchain/build-tools.tar.gz -C toolchain/build-tools
        rm toolchain/build-tools.tar.gz
        printf '%s\n' "$GITHUB_WORKSPACE/toolchain/clang/bin" >> "$GITHUB_PATH"
        printf '%s\n' "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/toolchain/build-tools/lib64:$GITHUB_WORKSPACE/toolchain/clang/lib" >> "$GITHUB_ENV"
    - name: Check tool versions and exact config
      run: |
        clang --version | tee diagnostics/clang-version.txt
        "$GITHUB_WORKSPACE/toolchain/build-tools/bin/pahole" --version | tee diagnostics/pahole-version.txt
        python3 - <<'CHECK'
        import pathlib, re, subprocess
        cfg = pathlib.Path('diagnostics/captured.config').read_text()
        expected = re.search(r'^CONFIG_CC_VERSION_TEXT="(.*)"$', cfg, re.M).group(1)
        actual = subprocess.check_output(['clang', '--version'], text=True).splitlines()[0]
        assert actual == expected, f'Clang mismatch:\nexpected: {expected}\nactual: {actual}'
        pahole = pathlib.Path('diagnostics/pahole-version.txt').read_text().strip()
        assert pahole == 'v1.25', f'Expected pahole v1.25, got {pahole}'
        CHECK
        mkdir -p out
        cp diagnostics/captured.config out/.config
        make -C "$KERNEL_SOURCE" O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1   PAHOLE="$GITHUB_WORKSPACE/toolchain/build-tools/bin/pahole"   CONFIG_OPLUS_DEVICE_DTBS=y olddefconfig 2>&1 | tee diagnostics/olddefconfig.log
        cp out/.config diagnostics/resolved.config
        python3 - <<'CHECK'
        import pathlib, re, sys

        def config_map(path):
            result = {}
            for line in pathlib.Path(path).read_text().splitlines():
                if line.startswith('CONFIG_') and '=' in line:
                    key, val = line.split('=', 1)
                    result[key] = val
                elif re.fullmatch(r'# CONFIG_\w+ is not set', line):
                    result[line.split()[1]] = 'n'
            return result

        old = config_map('diagnostics/captured.config')
        new = config_map('diagnostics/resolved.config')
        changes = [f'{key}: {old.get(key, "<absent>")} -> {new.get(key, "<absent>")}'
                   for key in sorted(old.keys() | new.keys()) if old.get(key) != new.get(key)]
        pathlib.Path('diagnostics/config-diff.txt').write_text('\n'.join(changes) + ('\n' if changes else 'No CONFIG changes.\n'))
        if changes:
            print('Config changed; stopping before compile. Inspect config-diff.txt:')
            print('\n'.join(changes))
            sys.exit(1)
        print('Config matches the captured running kernel.')
        CHECK
        make -s -C "$KERNEL_SOURCE" O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 kernelrelease > diagnostics/kernelrelease.txt
        cat diagnostics/kernelrelease.txt
        test "$(cat diagnostics/kernelrelease.txt)" = "$EXPECTED_RELEASE"
    - name: Build unchanged baseline Image
      run: |
        export KBUILD_BUILD_USER=root
        export KBUILD_BUILD_HOST=0bcf96a0baec
        export KBUILD_BUILD_VERSION=1
        export KBUILD_BUILD_TIMESTAMP='Thu Nov 5 01:33:32 UTC 2026'
        jobs=$(nproc)
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        make -C "$KERNEL_SOURCE" O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1   CONFIG_OPLUS_DEVICE_DTBS=y   PAHOLE="$GITHUB_WORKSPACE/toolchain/build-tools/bin/pahole"   -j"$jobs" Image 2>&1 | tee diagnostics/build.log
        test -s out/arch/arm64/boot/Image
        "$KERNEL_SOURCE/scripts/extract-ikconfig" out/arch/arm64/boot/Image > diagnostics/image.config
        python3 - <<'CHECK'
        import pathlib
        # The kernel embeds the resolved .config verbatim; do not accept an unrelated output.
        assert pathlib.Path('diagnostics/image.config').read_bytes() == pathlib.Path('out/.config').read_bytes(), 'Embedded config mismatch'
        CHECK
        cp out/arch/arm64/boot/Image artifacts/Image
        cp out/.config artifacts/baseline.config
        cp out/System.map artifacts/System.map
        if [ -f out/vmlinux.symvers ]; then cp out/vmlinux.symvers artifacts/; fi
        if [ -f out/Module.symvers ]; then cp out/Module.symvers artifacts/; fi
        (
          cd artifacts
          sha256sum Image baseline.config System.map > SHA256SUMS
        )
        cat > artifacts/READ_ME_FIRST.txt <<'NOTE'
        This is an UNTESTED baseline build for OnePlus OPD2413 / LineageOS 24.0 20261105.
        It contains no added KernelSU, no Droidspaces changes, and no third-party patches.
        Image is a raw kernel, NOT a boot.img and NOT a flashable ZIP.
        Do NOT run fastboot flash boot Image. It must be repacked into the matching LineageOS boot image.
        No external vendor modules or DTBs have been rebuilt or installed.
        Successful compilation does not prove that the device will boot or that vendor modules will load.
        Keep the verified working boot_a.img and init_boot_a.img backups for recovery.
        NOTE
    - name: Upload baseline and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: erhai-lineage24-20261105-baseline-${{ github.run_number }}
        path: |-
          artifacts/
          diagnostics/
        if-no-files-found: warn
        retention-days: 14
